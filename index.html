const sel=(o,v)=>o.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>${x[1]}</option>`).join('');
const days=k=>DN.map((n,i)=>`<label style="margin-inline-end:8px;white-space:nowrap"><input type="checkbox" ${(k==='off'?S.hz.off:S.rest).includes(i)?'checked':''} onchange="setDay('${k}',${i},this.checked)"> ${n}</label>`).join('');
let tt;function toast(m,ms){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),ms||2000)}
function restMsg(){const m=rmax();return m?`متاح ${m==1?'يوم':m==2?'يومان':m+' أيام'} راحة كل أسبوع`:'لا أيام راحة متاحة مع هذه المدة — زد مدة المراجعة لإيجاد أيام راحة'}
function pickUnit(u){S.unit=u;trimRest();save();render();refreshMode();toast(restMsg())}
function setUse(v){S.use=v;S.hz.on=v==='both'?1:0;save();render();openSet()}
function modeHtml(){const m=S.mode==='dur';let h=`<label><input type="radio" name="m" ${m?'checked':''} onchange="setv('mode','dur')"> أحدد مدة الدورة (والتطبيق يقترح الكمية)</label><br><label><input type="radio" name="m" ${m?'':'checked'} onchange="setv('mode','amt')"> أحدد كمية المراجعة (والتطبيق يحسب المدة)</label><br>`;
 if(m){const o=opts(),rm=n=>n<=S.dur?Math.min(5,Math.floor((S.dur-n)/(S.dur/7))):0,
  card=(x,t)=>x?`<label style="display:block;margin:6px 0;padding:6px;border:1px solid #cfc9b6;border-radius:8px"><input type="radio" name="o" ${S.unit===x[0]?'checked':''} onchange="pickUnit('${x[0]}')"> ${t}: <b>${UN[x[0]][0]}</b> يوميًا ← ${x[1]} يوم · ${rm(x[1])?`يسمح بـ ${rm(x[1])} راحة أسبوعيًا`:'بلا أيام راحة'}</label>`:'';
  h+=`<select onchange="setv('dur',+this.value)">${sel(DUR,S.dur)}</select>`+(o.lo||o.hi?card(o.lo,'⬇ الأقرب الأقل من مدتك')+card(o.hi,'⬆ الأقرب الأكثر من مدتك'):'<br><small>حدد المحفوظ أولًا</small>')}
 else h+=`<select onchange="setv('unit',this.value)">${sel(Object.entries(UN).map(([k,v])=>[k,v[0]]),S.unit)}</select> يوميًا`;
 return h+`<br><small>أيام راحة من المراجعة (لا تُحسب فائتة):</small><br>${days('rest')}`}
function refreshMode(){const e=$('mode');if(e){e.innerHTML=modeHtml();sum()}}
function openSet(tab){curTab=tab||curTab;const st=$('sb').parentNode.scrollTop,both=S.use==='both';
 sheet(`<h3>⚙️ الإعدادات</h3>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="b ${both?'l':''}" onclick="setUse('rev')">📖 للمراجعة فقط (يوصى)</button><button class="b ${both?'':'l'}" onclick="setUse('both')">📖 + 📗 للمراجعة والحفظ الجديد</button></div>
 <h4>كم تحفظ؟</h4>
 ${rangeHtml()}
 <h4>٢) إعدادات المراجعة</h4><div id="mode">${modeHtml()}</div><div id="sum"></div>
 ${both?`<h4>٣) إعدادات الحفظ الجديد</h4><select onchange="setz('u',this.value)">${sel(HZU,S.hz.u)}</select> يوميًا<br>
 <small>ابدأ من سورة:</small> <select onchange="setz('s',+this.value)">${sel(NM.map((x,i)=>[i+1,(i+1)+'. '+x]),S.hz.s)}</select><br>
 <small>الاتجاه يتبع ترتيب المراجعة. المحفوظ الجديد لا يدخل خطة المراجعة تلقائيًا؛ أضفه من التحديد عند الحاجة.</small><br>
 <small>أيام بلا حفظ جديد (من 2 إلى 4) لمراجعة الحفظ الجديد:</small><br>${days('off')}`:''}
 <h4>${both?'٤':'٣'}) تاريخ بداية الخطة</h4><input type="date" value="${S.start}" onchange="setStart(this.value)"><div id="dts" class="meta" style="line-height:1.9"></div>
 <h4>${both?'٥':'٤'}) تذكير يومي</h4><input type="time" value="${S.time}" onchange="setv('time',this.value)">
 <label style="display:block;margin-top:6px"><input type="checkbox" ${S.rn?'checked':''} onchange="setRn(this.checked)"> إظهار الإشعار خارج التطبيق (مثل واتساب)</label>
 <small>بدون التأشير يظهر التذكير داخل التطبيق. وللتنبيه والتطبيق مغلق أضِف التذكير لتقويم الهاتف:</small> <button class="b" data-act="ics">📲 تقويم الهاتف</button>
 <p><button class="b l" data-act="reset">🔄 إعادة الضبط</button> <button class="b g" data-act="savebtn">💾 حفظ</button></p>`);$('sb').parentNode.scrollTop=st;sum()}
function dates(P){const e=$('dts');if(!e)return;calcAI();const f=i=>new Intl.DateTimeFormat('ar',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(sd()+i*DAY));
 let c=-1;if(P.N)for(let i=0;i<365;i++)if(AI[i]===P.N-1){c=i;break}
 e.innerHTML=`📅 تبدأ الخطة: <b>${f(0)}</b>${c>=0?`<br>🏁 تنتهي الدورة الأولى: <b>${f(c)}</b>`:''}<br>🗓️ تنتهي الخطة (سنة كاملة): <b>${f(364)}</b>`}
function sum(){const P=plan(),e=$('sum');dates(P);if(!e)return;const r=S.rest.length;
 e.innerHTML=P.N?`✅ ${UN[S.unit][0]} يوميًا · <b>${P.N}</b> يوم مراجعة${r?` + ${r} راحة أسبوعيًا`:''} ← تكتمل الدورة في ≈ <b>${cycLen(P.N,r)}</b> يومًا`:'لم تحدد محفوظك بعد'}
function setDay(k,i,on){const A=new Set(k==='off'?S.hz.off:S.rest);on?A.add(i):A.delete(i);const a=[...A];
 if(k==='off'){if(a.length<2||a.length>4){toast('اختر من يومين إلى 4 أيام');return openSet()}S.hz.off=a}
 else{const m=rmax();if(a.length>m){toast(m?`المتاح ${m} أيام راحة أسبوعيًا فقط بحسب مدة المراجعة التي اخترتها؛ زد المدة لأيام راحة أكثر`:restMsg(),2500);return refreshMode()}S.rest=a}
 save();render();refreshMode()}
function setRn(on){S.rn=on?1:0;save();
 if(on&&!window.Notification){S.rn=0;save();toast('متصفحك لا يدعم الإشعارات الخارجية — استخدم تقويم الهاتف',3000);return openSet()}
 if(on&&Notification.permission==='default')Notification.requestPermission().then(p=>{if(p!=='granted'){S.rn=0;save();openSet();toast('لم يُسمح بالإشعارات من المتصفح',3000)}})}
function remCheck(){if(V)return;const t=tIdx();if(t<0||t>364||(!NN&&!S.hz.on))return;const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),td=iso(n);
 if(hm<S.time||full(t)||lsg('qr_rem')===td)return;try{localStorage.setItem('qr_rem',td)}catch(e){}
 const m='📖 حان وقت مراجعة الحفظ';let ok=0;
 if(S.rn&&window.Notification&&Notification.permission==='granted'){try{new Notification(m,{body:'افتح التطبيق لتسجيل إنجاز اليوم'});ok=1}catch(e){}}
 if(!ok)toast(m+' — لم تسجّل إنجاز اليوم بعد',6000)}
function setz(k,v){S.hz[k]=v;save();render()}
function setv(k,v){S[k]=v;fix(k==='dur');save();render();if(['dur','mode','unit'].includes(k)){refreshMode();if(S.mode==='dur'&&k!=='unit')toast(restMsg())}else sum()}
function setStart(v){if(!v)return;if(done.size&&!confirm('تغيير تاريخ البداية يصفّر سجل الإنجاز. متابعة؟'))return openSet();done.clear();skip.clear();hd.clear();S.nt={};setv('start',v)}
// ---- أوامر ----
function shareLink(){return location.href.split('#')[0]+'#v='+btoa(JSON.stringify(S)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+'&t='+Date.now()}
function ics(){const[h,m]=S.time.split(':'),n=new Date(),z=n.toISOString().replace(/[-:]|\.\d{3}/g,'');
 const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//QuranReview//AR','BEGIN:VEVENT','UID:qr-'+Date.now()+'@review','DTSTAMP:'+z,`DTSTART:${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}T${h}${m}00`,'RRULE:FREQ=DAILY;COUNT=365','SUMMARY:📖 مراجعة الحفظ','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:وقت مراجعة الحفظ','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));a.download='مراجعة-الحفظ.ics';a.click()}
const ACT={close(){$('sheet').classList.remove('show')},
 today(){const e=$('d'+Math.min(Math.max(tIdx(),0),364));e&&e.scrollIntoView({behavior:'smooth',block:'center'})},
 mark(){const t=tIdx();if(t<0||t>364||!plan().N||rest(t))return;if(done.has(t))return;missed(t).forEach(i=>done.add(i));done.add(t);save();finish(t,'r')},
 hmark(){const t=tIdx();if(t<0||t>364||S.hz.off.includes(dow(t)))return;if(hd.has(t))return;hd.add(t);save();finish(t,'h')},
 skipm(){missed(tIdx()).forEach(i=>skip.add(i));save();render()},
 tog(a){const i=+a.dataset.i;ACT.close();if(done.has(i)){done.delete(i);save();render();return}done.add(i);skip.delete(i);save();finish(i,'r')},
 htog(a){const i=+a.dataset.i;ACT.close();if(hd.has(i)){hd.delete(i);save();render();return}hd.add(i);save();finish(i,'h')},
 savebtn(){save();ACT.close();toast('✅ تم حفظ الإعدادات')},
 set(){openSet()},tab(a){openSet(a.dataset.t)},clr(){S.sel={s:[],j:[],h:[],r:[]};S.rg=null;save();render();openSet()},ics,
 share(){sheet(`<h3>🔗 رابط المتابعة (مشاهدة فقط)</h3><input type="text" id="sl" readonly style="width:100%" value="${shareLink()}" onclick="this.select()"><p><small>لولي الأمر أو الشيخ: يرى الخطة والإنجاز ولا يستطيع التعديل. هذه صورة لحالتك الآن، فأعد إرسال الرابط بعد أي تحديث.</small></p><button class="b" data-act="copy">📋 نسخ</button><button class="b g" data-act="wa">واتساب</button>`)},
 copy(){const i=$('sl');i.select();navigator.clipboard?navigator.clipboard.writeText(i.value):document.execCommand('copy')},
 wa(){window.open('https://wa.me/?text='+encodeURIComponent('📖 متابعة مراجعة الحفظ (مشاهدة فقط):\n'+$('sl').value),'_blank')},
 reload(){location.href=location.href.split('#')[0].split('?')[0]+'?v='+Date.now()+location.hash},
 home(){ACT.close();scrollTo({top:0,behavior:'smooth'})},
 reset(){if(confirm('سيتم مسح كل بيانات التطبيق وإعادة الضبط. متابعة؟')){try{localStorage.removeItem(KEY)}catch(e){}location.href=location.href.split('#')[0]}},
 note(a){const i=+a.dataset.i,v=$('nt').value.trim();v?S.nt[i]=v:delete S.nt[i];save();render();ACT.close()},
 exit(){location.href=location.href.split('#')[0]},
 theme(){const d=!document.body.classList.contains('dark');try{localStorage.setItem('qr_theme',d?'dark':'light')}catch(e){}ui()},
 mode(){const d=!document.body.classList.contains('desk');try{localStorage.setItem('qr_mode',d?'desk':'phone')}catch(e){}ui()},
 shareapp(){const u=location.href.split('#')[0],t='📖 تطبيق مراجعة وحفظ القرآن';navigator.share?navigator.share({title:t,url:u}).catch(()=>{}):window.open('https://wa.me/?text='+encodeURIComponent(t+'\n'+u),'_blank')},
 install(){DP?(DP.prompt(),DP=null):sheet('<h3>📲 تثبيت التطبيق</h3><p>أندرويد (كروم): القائمة ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<br>آيفون (سفاري): زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية».<br>الكمبيوتر (كروم/إيدج): أيقونة التثبيت في شريط العنوان.</p><small>يعمل التثبيت الكامل عندما يكون التطبيق مستضافًا على رابط https.</small>')},
 contact(){window.open('https://wa.me/97477107247?text='+encodeURIComponent('السلام عليكم أ. عزت، بخصوص تطبيق مراجعة الحفظ:'),'_blank')}};
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

 document.body.classList.toggle('dark',th==='dark');document.body.classList.toggle('desk',md==='desk');$('bt').textContent=th==='dark'?'☀️':'🌙';$('bm').textContent=md==='desk'?'📱':'🖥️'}

try{const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify({name:'مراجعة الحفظ',short_name:'مراجعة الحفظ',start_url:location.href.split('#')[0],display:'standalone',dir:'rtl',lang:'ar',background_color:'#0f2a4a',theme_color:'#0f2a4a',icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f2a4a'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E",sizes:'any',type:'image/svg+xml'}]})],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
setInterval(remCheck,30000);
document.addEventListener('click',e=>{const d=e.target.closest('.d');if(d)return openDay(+d.dataset.i);const a=e.target.closest('[data-act]');a&&ACT[a.dataset.act]&&ACT[a.dataset.act](a)});

 render();chk();setTimeout(remCheck,1500);if(!V&&!plan().N)openSet();else setTimeout(()=>{},0)}
